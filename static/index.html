<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HandyCRM — Field Service Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <!--
    Page frame only. Everything inside #workspace, #authScreen and the pop-up is drawn by app.js.
    Layout:  sidebar (menu) | top bar (title, bell, + New) / workspace / phone bottom bar
  -->

  <!-- SIGN-IN / FIRST-TIME SETUP (shown instead of the app when nobody is signed in) -->
  <div id="authScreen" class="auth-screen" hidden></div>

  <div id="appShell" class="app-shell" hidden>
    <!-- Dark overlay behind the phone menu -->
    <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>

    <!-- SIDEBAR (desktop: always visible / phone: slides in) -->
    <aside id="sidebar" class="sidebar" aria-label="Main Navigation">
      <div class="sidebar-brand">
        <div class="brand-logo" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="28" height="28" rx="7" fill="#2563EB"/>
            <path d="M6 13.5L14 7L22 13.5V21C22 21.5523 21.5523 22 21 22H7C6.44772 22 6 21.5523 6 21V13.5Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
            <rect x="11.5" y="14.5" width="5" height="5" rx="0.5" fill="white"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">Handy<span class="brand-accent">CRM</span></span>
          <span class="brand-subtitle" id="brandCompany">Field Service</span>
        </div>
        <button id="closeDrawerBtn" class="icon-btn mobile-only" aria-label="Close Menu">✕</button>
      </div>

      <!-- Who is signed in -->
      <div class="user-card">
        <div class="user-avatar" id="userAvatar">?</div>
        <div class="user-info">
          <div class="user-name" id="activeUserName">—</div>
          <div class="user-role" id="activeUserRole"></div>
        </div>
        <button class="icon-btn" data-action="sign-out" title="Sign out" aria-label="Sign out">⎋</button>
      </div>

      <!-- The whole menu: Tasks, Clients, Money (Employees: only their expenses), Team (Owner / Manager), Settings.
           Projects open from a client's card. -->
      <nav class="sidebar-nav">
        <button class="nav-item active" data-nav="tasks">
          <span class="nav-icon">☑️</span><span class="nav-label">Tasks</span>
          <span id="navTasksCount" class="nav-pill">0</span>
        </button>
        <button class="nav-item" data-nav="clients">
          <span class="nav-icon">👥</span><span class="nav-label">Clients</span>
        </button>
        <button class="nav-item" data-nav="money">
          <span class="nav-icon">💵</span><span class="nav-label" id="navMoneyLabel">Money</span>
          <span id="navUnpaidBadge" class="nav-pill pill-danger" hidden>0</span>
        </button>
        <button class="nav-item" data-nav="team" id="navTeam">
          <span class="nav-icon">👷</span><span class="nav-label">Team</span>
        </button>
        <button class="nav-item" data-nav="settings">
          <span class="nav-icon">⚙️</span><span class="nav-label">Settings</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button id="refreshDataBtn" class="sidebar-footer-btn" title="Load the latest data">
          <span>🔄</span> Sync Data
        </button>
      </div>
    </aside>

    <!-- MAIN COLUMN -->
    <div class="main-column">
      <header class="topbar">
        <div class="topbar-left">
          <button id="openDrawerBtn" class="icon-btn mobile-only" aria-label="Open Menu">☰</button>
          <button id="topbarBackBtn" class="back-btn" hidden>← Back</button>
          <div class="topbar-titles">
            <h1 id="pageTitle" class="page-title">Tasks</h1>
          </div>
        </div>

        <div class="topbar-right">
          <!-- (search lives on each screen, right above its table) -->
          <!-- "Saving..." -> "Saved ✓" (api.js setSave) -->
          <span id="saveState" class="save" role="status" aria-live="polite"></span>
          <!-- Edit / Delete of the record on screen (set by app.js) -->
          <div id="topbarActions" class="topbar-actions"></div>
          <!-- Notifications & approvals -->
          <button id="bellBtn" class="icon-btn bell-btn" data-nav="notifications" title="Notifications" aria-label="Notifications">
            🔔<span id="navNotifBadge" class="bell-badge" hidden>0</span>
          </button>
          <!-- THE one create button: Task, Client, Project, Receipt, Photo, Estimate, Invoice... -->
          <button class="btn btn-primary new-btn desktop-only" data-action="new">+ New</button>
        </div>
      </header>

      <!-- Role / approval info banner -->
      <div id="roleNoticeBanner" class="role-banner" hidden></div>

      <!-- Screens are drawn here -->
      <main id="workspace" class="workspace" tabindex="-1">
        <div class="loading-state"><div class="spinner"></div><p>Loading HandyCRM...</p></div>
      </main>

      <!-- Phone: the same "+ New" as a round button -->
      <button id="mobileFab" class="mobile-fab mobile-only" data-action="new" aria-label="New">+</button>

      <!-- Phone bottom bar -->
      <nav class="mobile-bottom-nav mobile-only" aria-label="Mobile Navigation">
        <button class="mob-nav-item active" data-nav="tasks"><span class="mob-icon">☑️</span><span class="mob-label">Tasks</span></button>
        <button class="mob-nav-item" data-nav="clients"><span class="mob-icon">👥</span><span class="mob-label">Clients</span></button>
        <button class="mob-nav-item" data-nav="money"><span class="mob-icon">💵</span><span class="mob-label">Money</span></button>
        <button id="mobMoreBtn" class="mob-nav-item"><span class="mob-icon">⋯</span><span class="mob-label">More</span></button>
      </nav>
    </div>
  </div>

  <!-- SHARED POP-UP WINDOW (forms, the "+ New" menu, the invoice editor...) -->
  <div id="modalOverlay" class="modal-overlay" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title">Title</h2>
        <button id="modalCloseBtn" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalFooter" class="modal-footer"></div>
    </div>
  </div>

  <script src="/static/api.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
